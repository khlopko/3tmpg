<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>999x999 Tic-Tac-Toe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
    canvas { display: block; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      color: #eee;
      font-family: monospace;
      font-size: 13px;
      background: rgba(0,0,0,0.6);
      padding: 8px 12px;
      border-radius: 6px;
      pointer-events: none;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="info">
    <div>Zoom: <span id="zoom-level">1.00</span></div>
    <div>Games: 111x111</div>
    <div>Grid: 333x333</div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
